
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sculpture 01 | Cutting Corners</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #171717;
      color: #f4f1eb;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 28px 7%;
      border-bottom: 1px solid #333;
    }

    header a {
      color: #f4f1eb;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 2px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 65px 7%;
    }

    .eyebrow {
      color: #aaa;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(38px, 7vw, 64px);
      font-weight: 400;
      margin: 15px 0 30px;
    }

  model-viewer {
  display: block;
  width: min(100%, 420px);
  aspect-ratio: 9 / 16;
  height: auto;
  margin: 0 auto;
  background: #171717;
  --poster-color: #171717;
}

    .instruction {
      color: #aaa;
      font-size: 13px;
      text-align: center;
      margin-top: 15px;
    }

    .about {
      max-width: 650px;
      margin-top: 65px;
      line-height: 1.7;
    }

    .about h2 {
      font-size: 20px;
      font-weight: 400;
    }

    footer {
      border-top: 1px solid #333;
      padding: 25px 7%;
      color: #888;
      font-size: 12px;
      letter-spacing: 1px;
    }

   
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">CUTTING CORNERS</a>
  </header>

  <main>
    <p class="eyebrow">Digital Sculpture · 01</p>

    <h1>Sculpture 01</h1>

    
<model-viewer
  src="Pose%201%20reduction%20exp.glb"
  alt="Interactive 3D view of Sculpture 01"
  camera-controls
  touch-action="pan-y"
  auto-rotate
  environment-image="legacy"
  exposure="0.55"
  tone-mapping="agx"
  shadow-intensity="0.5"
  shadow-softness="1">
</model-viewer>


    <p class="instruction">
      Drag to rotate · Scroll or pinch to zoom
    </p>

    <section class="about">
      <h2>About the work</h2>
      <p>
        Explore this digital sculpture in three dimensions.
        Rotate and zoom to discover its form, details and surfaces.
      </p>
    </section>
  </main>

  <footer>
    CUTTING CORNERS · DIGITAL SCULPTURE EXHIBITION
  </footer>

</body>
</html>
